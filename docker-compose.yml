services:
  database_postgres:
    container_name: postgres-stream
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432" # TODO: review this when putting on home server
    environment:
      POSTGRES_USER: streamer
      POSTGRES_PASSWORD: streamerWP14!
      POSTGRES_DB: mediadb 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamer -d mediadb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
  
  ms-backend:
    container_name: ms-backend
    build: . 
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
    volumes:
      - ${MEDIA_PATH}:${MEDIA_PATH}
      - ./app_data:/app/data
    depends_on:
      database_postgres:
        condition: service_healthy
